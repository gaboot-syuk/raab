# ============================================================
# supervisor — menjalankan tiga proses di dalam satu wadah
#
# Hosting gratis umumnya hanya memberi SATU wadah. Karena itu nginx, php-fpm,
# dan pekerja antrean harus hidup bersama di sini.
#
# Kalau salah satu mati, supervisor menyalakannya lagi. Itu penting terutama
# untuk pekerja antrean: pengiriman surat yang berjalan beberapa detik bisa
# membuat prosesnya berhenti, dan tanpa pengawasan, surat berhenti terkirim
# tanpa ada yang tahu sampai ada yang bertanya "kok saya tidak dapat email?".
#
# CATATAN TENTANG PEKERJA ANTREAN DAN BASIS DATA GRATIS:
#
# Aiven MySQL free tier mematikan layanan yang dianggap tidak ada aktivitas.
# Saat bangun kembali, hostname-nya sempat tidak bisa di-resolve selama
# beberapa detik sampai beberapa menit. Kalau pekerja antrean langsung
# dijalankan tanpa menunggu, ia akan gagal dan — dengan `autorestart=true` —
# supervisor akan menyalakannya lagi setiap satu detik tanpa henti. Itu
# membanjiri log, membebani CPU, dan tidak membantu basis data bangun lebih
# cepat.
#
# Karena itu:
#   1. `db:tunggu` dijalankan lebih dulu, menunggu sampai basis data siap.
#   2. `autorestart` diubah dari `true` menjadi `unexpected`, supaya
#      kegagalan yang disengaja (exit 1) tidak memicu restart tanpa akhir.
#   3. `startretries=3` memberi batas tiga percobaan sebelum menyerah.
#
# Konsekuensinya: kalau basis data benar-benar mati lama, pekerja antrean
# berhenti dan tidak dicoba lagi sampai wadah Render di-restart. Ini
# disengaja — lebih baik berhenti dengan tenang daripada gagal berulang
# kali tanpa guna.
# ============================================================

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Pekerja antrean.
#
# `--tries=3` supaya satu surat yang gagal tidak dicoba selamanya; setelah tiga
# kali, kegagalannya tercatat di tabel failed_jobs DAN di log, sehingga
# terlihat di halaman Diagnostik.
#
# `--max-time=3600` membuat pekerja memulai ulang setiap jam. Bukan karena
# rakus memori, melainkan supaya perubahan kode yang baru dipasang ikut
# terbaca — pekerja antrean menahan kode lama selama ia hidup.
#
# `db:tunggu --maks=90` menunggu hingga 3 menit (90 × 2 detik) sebelum
# pekerja benar-benar dijalankan. `exec` di depan perintah queue memastikan
# prosesnya menggantikan shell, supaya sinyal dari supervisor diteruskan
# dengan benar.
[program:queue]
command=sh -c "php /var/www/html/artisan db:tunggu --maks=90 && exec php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600"
autostart=true
autorestart=unexpected
startsecs=10
startretries=3
stopasgroup=true
killasgroup=true
priority=20
numprocs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0